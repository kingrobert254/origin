<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Edit Menu Makanan</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; margin: 0; padding: 40px; display: flex; justify-content: center; align-items: center; min-height: 80vh; }
        .edit-box { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 450px; border-top: 5px solid #e67e22; }
        h3 { margin-top: 0; color: #333; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 14px; color: #555; }
        input { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        .preview-container { margin-top: 10px; padding: 10px; background: #fafafa; border-radius: 4px; border: 1px solid #eee; }
        .preview-img { width: 100px; height: 100px; object-fit: cover; border-radius: 6px; margin-top: 5px; border: 1px solid #ddd; }
        .btn-group { display: flex; gap: 10px; margin-top: 20px; }
        .btn { padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; color: white; font-weight: bold; text-decoration: none; text-align: center; flex: 1; }
        .btn-save { background: #28a745; }
        .btn-cancel { background: #6c757d; }
    </style>
</head>
<body>

    <div class="edit-box">
        <h3>✏️ Edit Menu Makanan</h3>
        <p style="font-size: 12px; color: #777; margin-bottom: 20px;">Silakan ubah data menu di bawah ini. Kosongkan bagian input gambar jika tidak ingin mengganti gambar lama.</p>
        
        <form th:action="@{/admin/food/edit}" method="post" enctype="multipart/form-data">
            <input type="hidden" name="id" th:value="${food.id}">

            <div class="form-group">
                <label>Nama Makanan/Minuman</label>
                <input type="text" name="name" th:value="${food.name}" required>
            </div>

            <div class="form-group">
                <label>Harga (Rp)</label>
                <input type="number" name="price" th:value="${food.price}" required>
            </div>

            <div class="form-group">
                <label>Ganti Gambar Dokumen (Opsional)</label>
                <input type="file" name="imageFile" accept="image/*" style="border: none; padding: 5px 0;">
                
                <div class="preview-container">
                    <span style="font-size: 12px; color: #888; font-weight: bold;">Gambar Menu Saat Ini:</span><br>
                    <img th:src="${food.imageUrl}" class="preview-img">
                </div>
            </div>

            <div class="btn-group">
                <button type="submit" class="btn btn-save">Simpan Perubahan</button>
                <a th:href="@{/admin}" class="btn btn-cancel">Batal</a>
            </div>
        </form>
    </div>

</body>
</html>
